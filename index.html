<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<title>汇率换算 · Currency Converter</title>
<meta name="description" content="简洁的多币种汇率换算工具，支持人民币、美元、日元等法定货币。">
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e7ebf2;--accent:#285fe8;--accent-soft:#edf3ff;--ok:#13845b;--warn:#a15c00;--shadow:0 12px 36px rgba(24,39,75,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{width:min(1060px,calc(100% - 32px));margin:42px auto 56px}.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}h1{margin:7px 0 5px;font-size:clamp(28px,4vw,38px);letter-spacing:-.04em;line-height:1.15}.subtitle{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}.btn:hover{border-color:#b8c7e8;transform:translateY(-1px)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:disabled{opacity:.6;cursor:wait;transform:none}
.status{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:18px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#98a2b3;flex:none}.dot.ok{background:var(--ok)}.dot.warn{background:#d97706}.status strong{color:var(--ink);font-weight:650}.status .push{margin-left:auto}
.notice{display:none;border:1px solid #f3d6a3;background:#fff8eb;color:#83520b;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:13px}.notice.show{display:block}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.currency{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:13px;min-width:0;box-shadow:0 2px 8px rgba(24,39,75,.015);transition:border-color .15s,box-shadow .15s}.currency:focus-within{border-color:#8daaf5;box-shadow:0 0 0 3px rgba(40,95,232,.09)}.currency.base{border-color:#a9bfff;background:linear-gradient(120deg,#fff,#f8faff)}.flag{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:#f0f3f8;font-size:23px;flex:none}.meta{min-width:0;width:125px}.code{font-weight:750;letter-spacing:.025em}.name{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.field{min-width:0;flex:1;text-align:right}.amount{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:600 19px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;min-width:0;padding:4px 0}.amount::placeholder{color:#c0c7d2}.rate-note{font-size:11px;color:#8a94a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.footer{margin-top:22px;text-align:center;color:#8a94a6;font-size:12px}.footer a{color:inherit}.spinner{display:inline-block;width:12px;height:12px;border:2px solid #d5dced;border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:680px){.wrap{margin:28px auto 36px}.hero{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{flex:1}.grid{grid-template-columns:1fr;gap:9px}.currency{padding:13px}.meta{width:112px}.amount{font-size:18px}.status .push{margin-left:0;width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow">Currency tools</div>
      <h1>汇率换算</h1>
      <p class="subtitle">输入任意一种货币，自动换算其他币种。</p>
    </div>
    <div class="actions">
      <button class="btn" id="resetBtn" type="button">重置金额</button>
      <button class="btn primary" id="refreshBtn" type="button">↻ 刷新汇率</button>
    </div>
  </header>

  <section class="status" aria-live="polite">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">正在获取最新参考汇率…</span>
    <span class="push" id="updatedAt">数据来源：Frankfurter API</span>
  </section>
  <div class="notice" id="notice" role="status"></div>

  <section class="grid" id="currencyGrid" aria-label="货币换算列表"></section>

  <footer class="footer">
    汇率为参考数据，通常按工作日更新，不等同于银行实际成交价。
    数据来源：<a href="https://frankfurter.dev/" target="_blank" rel="noopener noreferrer">Frankfurter</a>。
  </footer>
</main>
<script>
'use strict';
const API = 'https://api.frankfurter.dev/v2/rates';
const CACHE_KEY = 'currency-converter-rates-v1';
const currencies = [
  {code:'CNY',name:'人民币',region:'中国',symbol:'¥',flag:'🇨🇳'},
  {code:'TWD',name:'新台币',region:'中国台湾',symbol:'NT$',flag:'🇹🇼'},
  {code:'HKD',name:'港元',region:'中国香港',symbol:'HK$',flag:'🇭🇰'},
  {code:'RUB',name:'俄罗斯卢布',region:'俄罗斯',symbol:'₽',flag:'🇷🇺'},
  {code:'USD',name:'美元',region:'美国',symbol:'$',flag:'🇺🇸'},
  {code:'INR',name:'印度卢比',region:'印度',symbol:'₹',flag:'🇮🇳'},
  {code:'VND',name:'越南盾',region:'越南',symbol:'₫',flag:'🇻🇳'},
  {code:'JPY',name:'日元',region:'日本',symbol:'¥',flag:'🇯🇵'},
  {code:'EUR',name:'欧元',region:'欧盟',symbol:'€',flag:'🇪🇺'},
  {code:'SGD',name:'新加坡元',region:'新加坡',symbol:'S$',flag:'🇸🇬'},
  {code:'GBP',name:'英镑',region:'英国',symbol:'£',flag:'🇬🇧'},
  {code:'ARS',name:'阿根廷比索',region:'阿根廷',symbol:'$',flag:'🇦🇷'},
  {code:'PHP',name:'菲律宾比索',region:'菲律宾',symbol:'₱',flag:'🇵🇭'},
  {code:'KRW',name:'韩元',region:'韩国',symbol:'₩',flag:'🇰🇷'},
  {code:'TRY',name:'土耳其里拉',region:'土耳其',symbol:'₺',flag:'🇹🇷'},
  {code:'AUD',name:'澳元',region:'澳大利亚',symbol:'A$',flag:'🇦🇺'},
  {code:'CHF',name:'瑞士法郎',region:'瑞士',symbol:'Fr',flag:'🇨🇭'},
  {code:'THB',name:'泰铢',region:'泰国',symbol:'฿',flag:'🇹🇭'},
  {code:'IDR',name:'印尼盾',region:'印度尼西亚',symbol:'Rp',flag:'🇮🇩'},
  {code:'CAD',name:'加拿大元',region:'加拿大',symbol:'C$',flag:'🇨🇦'},
  {code:'PKR',name:'巴基斯坦卢比',region:'巴基斯坦',symbol:'₨',flag:'🇵🇰'},
  {code:'MXN',name:'墨西哥比索',region:'墨西哥',symbol:'MX$',flag:'🇲🇽'},
  {code:'SAR',name:'沙特里亚尔',region:'沙特阿拉伯',symbol:'SR',flag:'🇸🇦'},
  {code:'MYR',name:'马来西亚林吉特',region:'马来西亚',symbol:'RM',flag:'🇲🇾'},
  {code:'BDT',name:'孟加拉塔卡',region:'孟加拉国',symbol:'৳',flag:'🇧🇩'}
];
const $ = (id) => document.getElementById(id);
let rates = null;
let rateDate = '';
let activeCode = 'CNY';
let busy = false;
const grid = $('currencyGrid');

function buildCards(){
  grid.innerHTML = currencies.map(c => `
    <article class="currency ${c.code === activeCode ? 'base' : ''}" data-card="${c.code}">
      <div class="flag" aria-hidden="true">${c.flag}</div>
      <div class="meta">
        <div class="code">${c.code}</div>
        <div class="name" title="${c.name} · ${c.region}">${c.name} · ${c.region}</div>
      </div>
      <div class="field">
        <input class="amount" type="text" inputmode="decimal" autocomplete="off" spellcheck="false"
          id="amount-${c.code}" data-code="${c.code}" aria-label="${c.name}金额" placeholder="—" value="${c.code === 'CNY' ? '100' : ''}">
        <div class="rate-note" id="rate-${c.code}">等待汇率数据</div>
      </div>
    </article>`).join('');
  grid.querySelectorAll('.amount').forEach(input => {
    input.addEventListener('focus', () => setActive(input.dataset.code));
    input.addEventListener('input', () => updateFromInput(input.dataset.code, input.value));
  });
}
function setActive(code){
  activeCode = code;
  grid.querySelectorAll('.currency').forEach(card => card.classList.toggle('base', card.dataset.card === code));
}
function parseAmount(value){
  const normalized = value.replace(/,/g,'').trim();
  if (normalized === '' || normalized === '-' || normalized === '.' || normalized === '-.') return null;
  const n = Number(normalized);
  return Number.isFinite(n) ? n : null;
}
function formatNumber(value, code){
  if (!Number.isFinite(value)) return '';
  const decimals = ['JPY','KRW','VND','IDR'].includes(code) ? 2 : 4;
  return new Intl.NumberFormat('en-US',{maximumFractionDigits:decimals,minimumFractionDigits:0}).format(value);
}
function updateFromInput(code, raw){
  setActive(code);
  const amount = parseAmount(raw);
  if (amount === null || !rates || !rates[code]){
    currencies.forEach(c => { if(c.code !== code) $('amount-'+c.code).value = ''; });
    return;
  }
  const usdValue = amount / rates[code];
  currencies.forEach(c => {
    if (c.code === code) return;
    const input = $('amount-'+c.code);
    input.value = formatNumber(usdValue * rates[c.code], c.code);
  });
}
function renderRates(){
  if(!rates) return;
  currencies.forEach(c => {
    const rate = rates[c.code];
    $('rate-'+c.code).textContent = rate ? `1 USD ≈ ${formatNumber(rate,c.code)} ${c.code}` : '此币种暂无数据';
  });
  const current = parseAmount($('amount-'+activeCode).value);
  if(current !== null) updateFromInput(activeCode, $('amount-'+activeCode).value);
}
function setStatus(message, state='normal', updated=''){
  $('statusText').textContent = message;
  $('statusDot').className = 'dot' + (state === 'ok' ? ' ok' : state === 'warn' ? ' warn' : '');
  $('updatedAt').textContent = updated || '数据来源：Frankfurter API';
}
function showNotice(message){
  $('notice').textContent = message;
  $('notice').classList.add('show');
}
function hideNotice(){
  $('notice').textContent = '';
  $('notice').classList.remove('show');
}
function loadCache(){
  try{
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if(cached && cached.rates && cached.date){
      rates = cached.rates;
      rateDate = cached.date;
      renderRates();
      setStatus('当前使用上次成功保存的参考汇率', 'warn', `数据日期：${rateDate}`);
      return true;
    }
  }catch(e){}
  return false;
}
async function refreshRates(){
  if(busy) return;
  busy = true;
  $('refreshBtn').disabled = true;
  $('refreshBtn').innerHTML = '<span class="spinner"></span>正在刷新';
  hideNotice();
  setStatus('正在请求最新参考汇率…');
  try{
    const quotes = currencies.filter(c=>c.code !== 'USD').map(c=>c.code).join(',');
    const url = `${API}?base=USD&quotes=${encodeURIComponent(quotes)}`;
    const response = await fetch(url, {headers:{'Accept':'application/json'}, cache:'no-store'});
    if(!response.ok) throw new Error(`汇率服务返回 HTTP ${response.status}`);
    const data = await response.json();
    if(!Array.isArray(data)) throw new Error('接口返回格式不正确');
    const nextRates = {USD:1};
    let latestDate = '';
    data.forEach(item => {
      if(item && item.base === 'USD' && typeof item.quote === 'string' &&
         Number.isFinite(Number(item.rate)) && Number(item.rate) > 0){
        nextRates[item.quote] = Number(item.rate);
        if(item.date && item.date > latestDate) latestDate = item.date;
      }
    });
    const missing = currencies.filter(c=>!nextRates[c.code]).map(c=>c.code);
    const required = currencies.filter(c=>!missing.includes(c.code));
    if(required.length < 10) throw new Error('有效汇率数据不足，未覆盖足够多的币种');
    rates = nextRates;
    rateDate = latestDate || new Date().toISOString().slice(0,10);
    localStorage.setItem(CACHE_KEY, JSON.stringify({rates, date:rateDate, savedAt:new Date().toISOString()}));
    renderRates();
    if(missing.length){
      setStatus(`汇率已更新，${missing.length} 个币种暂不可用`, 'warn', `数据日期：${rateDate}`);
      showNotice(`当前数据源暂不支持这些币种：${missing.join(', ')}。这些项目不会使用虚构汇率。`);
    }else{
      setStatus('参考汇率已更新', 'ok', `数据日期：${rateDate}`);
    }
  }catch(error){
    if(!rates) loadCache();
    if(rates){
      setStatus('更新失败，继续使用上次成功的数据', 'warn', rateDate ? `缓存日期：${rateDate}` : '');
      showNotice(`本次获取汇率失败：${error.message}。当前保留最近一次成功数据；请稍后重试。`);
    }else{
      setStatus('无法获取汇率数据', 'warn');
      showNotice(`无法连接汇率服务：${error.message}。请检查网络后点击“刷新汇率”重试。`);
    }
  }finally{
    busy = false;
    $('refreshBtn').disabled = false;
    $('refreshBtn').textContent = '↻ 刷新汇率';
  }
}
$('refreshBtn').addEventListener('click', refreshRates);
$('resetBtn').addEventListener('click', () => {
  activeCode = 'CNY';
  currencies.forEach(c => $('amount-'+c.code).value = '');
  $('amount-CNY').value = '100';
  setActive('CNY');
  updateFromInput('CNY','100');
});
buildCards();
loadCache();
refreshRates();
</script>
</body>
</html>
